services:
  judge0-server:
    image: judge0/judge0:1.13.1
    ports:
      - "2358:2358"
    env_file:
      - ./judge0.conf
    volumes:
      - judge0-data:/data
      - ./mock_isolate.sh:/usr/local/bin/isolate:ro
    depends_on:
      judge0-db:
        condition: service_healthy
      judge0-redis:
        condition: service_healthy
    restart: unless-stopped

  judge0-workers:
    image: judge0/judge0:1.13.1
    user: root
    env_file:
      - ./judge0.conf
    volumes:
      - judge0-data:/data
      - ./mock_isolate.sh:/usr/local/bin/isolate:ro
    depends_on:
      judge0-db:
        condition: service_healthy
      judge0-redis:
        condition: service_healthy
    restart: unless-stopped

  judge0-db:
    image: postgres:16-alpine
    env_file:
      - ./judge0.conf
    volumes:
      - judge0-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  judge0-redis:
    image: redis:7-alpine
    command:
      [
        "sh",
        "-lc",
        "exec redis-server --appendonly no --requirepass \"$REDIS_PASSWORD\"",
      ]
    env_file:
      - ./judge0.conf
    volumes:
      - judge0-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  judge0-data:
  judge0-postgres-data:
  judge0-redis-data:
  judge0-box:
